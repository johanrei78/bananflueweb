<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arv hos bananfluer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Arv hos bananfluer</h1>

        <nav aria-label="Hovedmeny">
            <button type="button" data-page="velg-foreldre">Velg foreldre</button>
            <button type="button" data-page="krysning">Krysning</button>
            <button type="button" data-page="resultater">Resultater</button>
            <button type="button" data-page="oppsummering">Oppsummering</button>
    </nav>
    </header>

    <main id="main-content">

    <section id="velg-foreldre">
        <h2>Velg foreldre</h2>

        <p>
            Velg fenotypene til foreldrene i P-generasjonen.
        </p>

        <div class="form-grid">

            <div class="form-group">
                <label for="antenner">Antenner</label>
                <select id="antenner">
                    <option value="Normal">Normal</option>
                    <option value="Aristapedia">Aristapedia</option>
                </select>
            </div>

            <div class="form-group">
                <label for="oyefarge">Øyefarge</label>
                <select id="oyefarge">
                    <option value="Rød">Rød</option>
                    <option value="Hvit">Hvit</option>
                </select>
            </div>

            <div class="form-group">
                <label for="kropp">Kropp</label>
                <select id="kropp">
                    <option value="Grå">Grå</option>
                    <option value="Sort">Sort</option>
                </select>
            </div>

            <div class="form-group">
                <label for="vinger">Vinger</label>
                <select id="vinger">
                    <option value="Normal">Normal</option>
                    <option value="Redusert">Redusert</option>
                </select>
            </div>

        </div>

        <fieldset class="sex-choice">
            <legend>Kjønn</legend>

            <label>
                <input type="radio" name="kjonn" value="Hunn" checked>
                Hunn ♀
            </label>

            <label>
                <input type="radio" name="kjonn" value="Hann">
                Hann ♂
            </label>
        </fieldset>

        <div class="button-row">
            <button type="button" id="legg-til-forelder">
                Legg til forelder
            </button>

            <button type="button" id="reset">
                Reset
            </button>
        </div>

        <h3>Valgte P-foreldre</h3>

        <div id="valgte-foreldre" class="parent-grid">
            <p>Ingen foreldre valgt ennå.</p>
        </div>

    </section>

    <section id="krysning" hidden>

    <h2>Krysning</h2>

    <p id="krysning-status">
        Start med å velge to P-foreldre på siden «Velg foreldre».
    </p>

    <div id="krysningsforeldre" class="parent-grid">
    </div>

    <div class="button-row">
        <button type="button" id="utfor-krysning">
            Utfør krysning (≈1000 avkom)
        </button>
    </div>

    </section>

    <section id="resultater" hidden>

    <h2>Resultater</h2>

    <p id="resultat-status">
        Ingen krysninger ennå.
    </p>

    <div id="resultat-faner" class="resultat-faner"></div>
        
    <div id="resultat-grid"></div>

    
    </section>
        
</main>

    </main>

    <script src="app.js?v=2"></script>

</body>
</html>
